name: Compose Guardrails

on:
  pull_request:
  push:
    branches:
      - main

env:
  COMPOSE_GUARDRAILS_TARGET: tools/compose-guardrails/src/main
  COMPOSE_GUARDRAILS_RULE_SET: default
  COMPOSE_GUARDRAILS_REPORT_PATH: artifacts/compose-guardrails-report.md
  COMPOSE_GUARDRAILS_CHANGED_FILES_ONLY: false
  COMPOSE_GUARDRAILS_FAIL_ON_FINDINGS: false
  COMPOSE_GUARDRAILS_WRITE_STEP_SUMMARY: true

jobs:
  compose-guardrails:
    runs-on: ubuntu-latest
    env:
      MOBILE_AI_PROVIDER: fake
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :shared:ai-client:test :shared:report-common:test :tools:compose-guardrails:test

      - name: Validate changed-files helper logic
        run: .github/scripts/test-run-compose-guardrails.sh

      - name: Validate reusable action manifest
        run: .github/scripts/test-compose-guardrails-action.sh

      - name: Validate external repository usage
        run: .github/scripts/test-compose-guardrails-external.sh

      - name: Run compose-guardrails analysis
        id: analyze
        uses: ./.github/actions/compose-guardrails
        with:
          target: ${{ env.COMPOSE_GUARDRAILS_TARGET }}
          rule-set: ${{ env.COMPOSE_GUARDRAILS_RULE_SET }}
          provider: ${{ env.MOBILE_AI_PROVIDER }}
          report-path: ${{ env.COMPOSE_GUARDRAILS_REPORT_PATH }}
          changed-files-only: ${{ env.COMPOSE_GUARDRAILS_CHANGED_FILES_ONLY }}
          fail-on-findings: ${{ env.COMPOSE_GUARDRAILS_FAIL_ON_FINDINGS }}
          write-step-summary: ${{ env.COMPOSE_GUARDRAILS_WRITE_STEP_SUMMARY }}

      - name: Upload guardrails report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-guardrails-report
          path: ${{ steps.analyze.outputs.report-path }}
