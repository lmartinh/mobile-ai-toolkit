name: Release Compose Guardrails

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never

      - name: Run tests
        run: ./gradlew --quiet --console=plain :shared:ai-client:test :shared:report-common:test :tools:compose-guardrails:test

      - name: Validate release packaging
        run: .github/scripts/test-compose-guardrails-release-packaging.sh

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compose-guardrails-release-packages-${{ github.ref_name }}
          path: tools/compose-guardrails/build/distributions/*
