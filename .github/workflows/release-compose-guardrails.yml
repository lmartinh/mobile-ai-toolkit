name: Release Compose Guardrails

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew :shared:ai-client:test :shared:report-common:test :tools:compose-guardrails:test

      - name: Validate release packaging
        run: .github/scripts/test-compose-guardrails-release-packaging.sh

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compose-guardrails-release-packages
          path: tools/compose-guardrails/build/distributions/*
