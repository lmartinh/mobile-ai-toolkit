<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">mobile-ai-toolkit hero banner</title>
  <desc id="desc">AI-assisted mobile code analysis tools hero image</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04102b"/>
      <stop offset="50%" stop-color="#071a45"/>
      <stop offset="100%" stop-color="#0a224f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#19c2ff"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>

  <g opacity="0.2" stroke="#2dd4bf" stroke-width="2" fill="none">
    <path d="M0 420 C220 360, 420 520, 640 470 C840 420, 1020 540, 1260 470 C1400 430, 1510 460, 1600 430"/>
    <path d="M0 460 C250 410, 470 560, 700 500 C900 450, 1140 560, 1600 500"/>
  </g>

  <g opacity="0.25" stroke="#38bdf8" stroke-width="2">
    <line x1="130" y1="140" x2="320" y2="140"/>
    <line x1="1280" y1="140" x2="1470" y2="140"/>
    <line x1="130" y1="390" x2="320" y2="390"/>
    <line x1="1280" y1="390" x2="1470" y2="390"/>
  </g>

  <g transform="translate(800,120)" filter="url(#glow)">
    <polygon points="0,-42 36,-21 36,21 0,42 -36,21 -36,-21" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <text x="0" y="12" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" fill="#b9f3ff" font-weight="800">K</text>
  </g>

  <text x="800" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="102" fill="#f8fafc" font-weight="800">mobile-ai-toolkit</text>
  <rect x="450" y="292" width="700" height="4" rx="2" fill="url(#accent)"/>
  <text x="800" y="355" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" fill="#cbd5e1" font-weight="500">AI-assisted mobile code analysis tools</text>

  <g transform="translate(455,430)">
    <circle cx="0" cy="0" r="10" fill="#22d3ee"/>
    <text x="28" y="10" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#dbeafe" font-weight="600">Static analysis</text>
  </g>
  <g transform="translate(790,430)">
    <circle cx="0" cy="0" r="10" fill="#34d399"/>
    <text x="28" y="10" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#dbeafe" font-weight="600">AI insights</text>
  </g>
  <g transform="translate(1040,430)">
    <circle cx="0" cy="0" r="10" fill="#818cf8"/>
    <text x="28" y="10" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#dbeafe" font-weight="600">Mobile quality guardrails</text>
  </g>
</svg>
